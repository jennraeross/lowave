[package]
name = "lowave"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
eframe = "0.32"
egui = "0.32"
rodio = "0.21"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
rfd = "0.15"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
anyhow = "1"
crossbeam-channel = "0.5"
env_logger = "0.11"
log = "0.4"
