name: release

# Cut a release with:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: lowave-x86_64-linux
            ytdlp: yt-dlp_linux
            sidecar: yt-dlp
          - os: windows-latest
            asset: lowave-x86_64-windows
            ytdlp: yt-dlp.exe
            sidecar: yt-dlp.exe
          - os: macos-latest
            asset: lowave-aarch64-macos
            ytdlp: yt-dlp_macos
            sidecar: yt-dlp
          - os: macos-15-intel
            asset: lowave-x86_64-macos
            ytdlp: yt-dlp_macos
            sidecar: yt-dlp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl \
            libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Stage archive
        shell: bash
        run: |
          rm -rf dist && mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Icon is embedded in the exe via winres (build.rs).
            cp target/release/lowave.exe dist/
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # Proper .app bundle so the .icns icon applies.
            APP=dist/Lowave.app
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp target/release/lowave "$APP/Contents/MacOS/"
            cp assets/macos/Info.plist "$APP/Contents/"
            cp assets/macos/icon.icns "$APP/Contents/Resources/"
          else
            cp target/release/lowave dist/
            # Freedesktop icons + launcher (see README for install paths).
            mkdir -p dist/icons dist/applications
            cp -r assets/linux/icons/* dist/icons/
            cp assets/linux/lowave.desktop dist/applications/
          fi
          cp README.md LICENSE-MIT dist/
          # Bundle a yt-dlp sidecar (Unlicense); the app looks beside its
          # exe first (Contents/MacOS inside the .app). ffmpeg is still
          # required separately.
          if [ "${{ runner.os }}" = "macOS" ]; then
            SIDECAR_DIR=dist/Lowave.app/Contents/MacOS
          else
            SIDECAR_DIR=dist
          fi
          curl -sSL -o "$SIDECAR_DIR/${{ matrix.sidecar }}" \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/${{ matrix.ytdlp }}"
          chmod +x "$SIDECAR_DIR/${{ matrix.sidecar }}" 2>/dev/null || true

      - name: Pack archive
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.asset }}.zip" *
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent Lowave.app "../${{ matrix.asset }}.zip"
          else
            tar czf "../${{ matrix.asset }}.tar.gz" *
          fi
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
          echo "Released ${{ github.ref_name }}. macOS ships a Lowave.app bundle, Windows an exe with embedded icon, Linux a binary plus hicolor icons and a .desktop file; every archive also holds a yt-dlp sidecar, ffmpeg must still be installed separately."
